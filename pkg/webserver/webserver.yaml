web:
  bind_address:
    host: 0.0.0.0
    port: 10000
  grpc:
    max_receive_message_size: 0 # 0 means max message size 
    max_send_message_size : 0
    timeout: 0s
  http:
    timeout: 0s
  debug:
    enable_profiling: true
    # print inoutput use local middleware function
    disable_print_inoutput_methods: [""]
  
  # OpenTelemetry 统一监控配置
  open_telemetry:
    enabled: true
    metric_collect_duration: 60s
    otel_trace_exporter_type: trace_stdout
    otel_metric_exporter_type: metric_stdout
    otel_log_exporter_type: log_none
    otel_metric_exporter:
      stdout:
        pretty_print: true
      prometheus:
        url: /metrics
    otel_trace_exporter:
      stdout:
        pretty_print: true
      jaeger:
        url: http://localhost:14268/api/traces
    resource:
      service_name: ""  # 默认使用进程名
      attrs: {}
    # 从旧 monitor.prometheus 迁移的配置
    enabled_metric_timer_cost: true
    enabled_metric_code_message: true

  # QPS限流配置
  qps_limit:
    grpc:
      default_qps: 0        # 默认QPS，0表示不限制
      default_burst: 0      # 默认突发容量
      max_concurrency: 0    # 最大并发数限制，0表示不限制
      method_qps: []
    http:
      default_qps: 0
      default_burst: 0
      max_concurrency: 0
      method_qps: []

