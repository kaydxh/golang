syntax = "proto3";

package go.pkg.webserver;

import "google/protobuf/duration.proto";

option go_package = "github.com/kaydxh/golang/pkg/webserver;webserver";

message Web {
  Net bind_address = 1;
  message Net {
    string host = 1;
    int32 port = 2;
  }

  Grpc grpc = 3;
  message Grpc {
    int32 max_receive_message_size = 3;
    int32 max_send_message_size = 4;
    google.protobuf.Duration timeout = 5;
  }

  Http http = 4;
  message Http {
    ApiFormatter api_formatter = 1;
    // timeout 0 is not unlimited
    google.protobuf.Duration timeout = 3;

    enum ApiFormatter {
      api_noop = 0;
      tcloud_api_v30 = 1;
      trivial_api_v10 = 2;
      trivial_api_v20 = 3;
    }
  }

  Debug debug = 10;
  message Debug {
    bool enable_profiling = 1;
    repeated string disable_print_inoutput_methods = 2;
  }

  // OpenTelemetry 统一监控配置（替代旧的 Monitor）
  OpenTelemetry open_telemetry = 12;
  message OpenTelemetry {
    bool enabled = 1;

    google.protobuf.Duration metric_collect_duration = 2;
    OtelTraceExporterType otel_trace_exporter_type = 3;
    OtelMetricExporterType otel_metric_exporter_type = 4;
    OtelLogExporterType otel_log_exporter_type = 5;

    OtelMetricExporter otel_metric_exporter = 6;
    OtelTraceExporter otel_trace_exporter = 7;

    Resource resource = 10;

    // 从旧 Monitor.Prometheus 迁移的配置
    bool enabled_metric_timer_cost = 20;
    bool enabled_metric_code_message = 21;

    message Resource {
      string service_name = 1;
      map<string, string> attrs = 2;
    }

    message OtelMetricExporter {
      Prometheus prometheus = 1;
      Stdout stdout = 2;
    }

    message OtelTraceExporter {
      Jaeger jaeger = 1;
      Stdout stdout = 2;
    }

    message Prometheus {
      string url = 1;
    }

    message Jaeger {
      string url = 1;
    }

    message Stdout {
      bool pretty_print = 1;
    }

    enum OtelTraceExporterType {
      trace_none = 0;
      trace_stdout = 1;
      trace_otlp = 2;
      trace_jaeger = 3;
      trace_zipkin = 4;
    }

    enum OtelMetricExporterType {
      metric_none = 0;
      metric_stdout = 1;
      metric_otlp = 2;
      metric_prometheus = 3;
    }

    enum OtelLogExporterType {
      log_none = 0;
      log_otlp = 1;
    }
  }

  // Deprecated: 使用 open_telemetry 替代
  // 保留字段编号以保持向后兼容
  reserved 11;
  reserved "monitor";
}
