syntax = "proto3";

package go.pkg.opentelemetry;

import "google/protobuf/duration.proto";

option go_package = "github.com/kaydxh/golang/pkg/opentelemetry;opentelemetry";

// OpenTelemetry 统一监控配置（去掉 Monitor 包装层）
message OpenTelemetry {
  bool enabled = 1;

  google.protobuf.Duration metric_collect_duration = 2;
  OtelTraceExporterType otel_trace_exporter_type = 3;
  OtelMetricExporterType otel_metric_exporter_type = 4;
  OtelLogExporterType otel_log_exporter_type = 5;

  OtelMetricExporter otel_metric_exporter = 6;
  OtelTraceExporter otel_trace_exporter = 7;

  Resource resource = 10;

  // App MeterProvider configuration (separate from global)
  // If enabled, creates an independent MeterProvider for application-level metrics
  AppMeterProvider app_meter_provider = 11;
}

// AppMeterProvider configuration for application-level metrics
// Allows separation between infrastructure metrics (global) and business metrics (app)
message AppMeterProvider {
  bool enabled = 1;  // Enable separate App MeterProvider

  // Exporter type for app metrics (if different from global)
  // If not set, uses the same exporter type as global
  OtelMetricExporterType exporter_type = 2;

  // Exporter configuration (if different from global)
  OtelMetricExporter exporter = 3;

  // Collect duration for app metrics (if different from global)
  google.protobuf.Duration collect_duration = 4;

  // Resource attributes specific to app metrics
  // If not set, inherits from global resource
  Resource resource = 5;
}

message Resource {
  string service_name = 1;     // default use process name
  string service_version = 2;  // service version
  map<string, string> attrs = 3;

  // K8s resource configuration
  K8sResource k8s = 10;

  // APM (Application Performance Management) configuration
  Apm apm = 11;

  // ZhiYan platform configuration for internal monitoring
  ZhiYan zhiyan = 12;
}

// APM configuration for Application Performance Management
// Token is required for APM data reporting and will be added as resource attribute
message Apm {
  // APM Token for authentication, associated with business system
  string token = 1;
}

// ZhiYan platform configuration for internal monitoring
message ZhiYan {
  // App mark for metric reporting (上报 appMark)
  // Used for business data reporting
  string app_mark = 1;

  // Global app mark for modcall and system-level metric reporting
  // Used for infrastructure/global metrics
  string global_app_mark = 2;

  // Environment for metric reporting (e.g., "prod", "test", "dev")
  // If empty, defaults to "prod" for production environment
  string env = 3;

  // Instance mark for attribute reporting
  // If empty, uses pod IP or host IP
  string instance_mark = 4;

  // APM Token for trace reporting to ZhiYan APM
  string zhiyan_apm_token = 5;

  // Whether to expand resource attributes to metric dimensions
  // "yes" or "no" (default: "no")
  string expand_key = 6;

  // Metric group for ZhiYan (指标组)
  // This is used as the scope name when creating Meter
  // If empty, defaults to "default"
  // Common values: "default", "client_report", "server_report"
  string metric_group = 7;

  // Data granularity for metric reporting (数据粒度)
  // Valid values: 10, 30, 60 (default: 60, minutes)
  // For sub-minute reporting, set data_type to "second"
  int32 data_grain = 8;

  // Data type for metric reporting (数据类型)
  // Set to "second" for sub-minute granularity data
  string data_type = 9;
}

message K8sResource {
  bool enabled = 1;  // enable K8s attribute detection from env vars (default: true)

  // Override values (if not set, read from environment variables)
  string node_ip = 2;           // override NODE_IP env var
  string pod_namespace = 3;     // override POD_NAMESPACE env var
  string pod_name = 4;          // override POD_NAME env var
  string pod_ip = 5;            // override POD_IP env var
  string container_name = 6;    // override CONTAINER_NAME env var
  string container_platform = 7; // override CONTAINER_PLATFORM env var (e.g., STKE, TKE)
}

message OtelMetricExporter {
  Prometheus prometheus = 1;
  Stdout stdout = 2;
  OTLP otlp = 3;
}

message OtelTraceExporter {
  Stdout stdout = 1;
  OTLP otlp = 2;
}

message Prometheus {
  string url = 1;
}

message Stdout {
  bool pretty_print = 1;
}

// OTLP exporter configuration for Tencent Cloud Prometheus or other OTLP-compatible backends
message OTLP {
  // Endpoint URL (e.g., "prometheus.tencentcloudapi.com:4317" for gRPC)
  // For Tencent Cloud Prometheus, use the Remote Write address from console
  string endpoint = 1;

  // Authentication token (e.g., Tencent Cloud Prometheus Token)
  string token = 2;

  // Protocol: "http" or "grpc" (default: "http")
  string protocol = 3;

  // Use insecure connection (default: false)
  bool insecure = 4;

  // Custom headers for authentication
  map<string, string> headers = 5;

  // URL path for HTTP protocol (default: "/v1/metrics")
  string url_path = 6;

  // Enable gzip compression (ZhiYan requires compression=gzip)
  bool compression = 7;

  // Use Delta temporality instead of Cumulative (ZhiYan requires temporality_selector=delta)
  bool temporality_delta = 8;
}

enum OtelTraceExporterType {
  trace_none = 0;
  trace_stdout = 1;
  trace_otlp = 2;
}

enum OtelMetricExporterType {
  metric_none = 0;
  metric_stdout = 1;
  metric_otlp = 2;
  metric_prometheus = 3;
}

enum OtelLogExporterType {
  log_none = 0;
  log_otlp = 1;
}
